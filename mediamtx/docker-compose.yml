services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx-server
    restart: unless-stopped
    network_mode: host

    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

    environment:
      MTX_LOGLEVEL: info

    logging:
      options:
        max-size: "10m"
        max-file: "3"
