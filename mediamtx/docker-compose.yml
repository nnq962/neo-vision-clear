services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    container_name: mediamtx-server
    restart: unless-stopped

    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

    expose:
      - "8554"
      - "8889"
      - "9997"

    ports:
      # Tạm phục vụ backend và Next dev chạy trực tiếp trên máy host.
      - "127.0.0.1:8554:8554/tcp"
      - "127.0.0.1:8889:8889/tcp"
      - "127.0.0.1:9997:9997/tcp"

      # ICE media phải được các máy trong LAN truy cập trực tiếp.
      - "8189:8189/udp"
      - "8189:8189/tcp"

    environment:
      MTX_LOGLEVEL: info

    networks:
      - neo-vision-clear

    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  neo-vision-clear:
    name: neo-vision-clear
    ipam:
      config:
        - subnet: 172.30.0.0/24
