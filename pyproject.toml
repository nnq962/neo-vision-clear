[project]
name = "neo-vision-clear"
version = "0.1.0"
description = "Fixed-camera occupancy detection demo using OpenCV"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "colorlog>=6.10.1",
    "numpy>=2.2.6,<3",
    "opencv-python==4.13.0.92",
    "pillow>=10.0.0",
    "pytz>=2026.2",
    "pyyaml>=6.0.3",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "yt-dlp>=2026.6.9",
]

[project.scripts]
walkway-monitor = "walkway_monitor.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "walkway_monitor",
    "walkway_monitor.calibration",
    "walkway_monitor.depth",
    "walkway_monitor.detection",
    "walkway_monitor.ui",
    "depth_anything_v2",
    "depth_anything_v2.dinov2_layers",
    "depth_anything_v2.util",
    "media_sources",
    "media_sources.readers",
    "utils",
]
package-dir = { "" = "src", utils = "utils" }

[tool.uv.sources]
opencv-python = { path = "wheels/pc-x86_64/opencv_python-4.13.0.92-cp310-cp310-linux_x86_64.whl" }
